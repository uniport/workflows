name: 'Set Maven Project Version'
description: 'Sets the project version in all maven modules'

# Thin wrapper around base/set-maven-project-version, kept so callers pinned to this path keep working.
# The implementation lives in base/set-maven-project-version; change it there.

inputs:
  version:
    description: 'The version to update in the Maven module(s)'
    required: true
  script:
    description: 'Whether to use the update version script instead of the maven build-helper plugin'
    required: false
  settings-file:
    description: 'Maven related setting to point to the settings.xml file used. Default is ~/.m2/settings.xml.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - uses: uniport/workflows/.github/actions/base/set-maven-project-version@main
      with:
        version: ${{ inputs.version }}
        script: ${{ inputs.script }}
        settings-file: ${{ inputs.settings-file }}
