name: Disable man-db triggers
description: Disables man-db triggers on Linux runners to optimize GitHub Actions

# Thin wrapper around base/disable-man-db-triggers, kept so callers pinned to this path keep working.
# The implementation lives in base/disable-man-db-triggers; change it there.

runs:
  using: composite
  steps:
    - uses: uniport/workflows/.github/actions/base/disable-man-db-triggers@main
