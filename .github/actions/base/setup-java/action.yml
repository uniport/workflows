name: 'Setup Java'
description: 'Sets up Java'
inputs:
  distribution:
    description: 'Java distribution'
    required: true
    default: 'temurin'
  architecture:
    description: 'The target architecture of the package. Possible values: `x86`, `x64`, `armv7`, `aarch64`, `ppc64le`. Default value: Derived from the runner machine.'
    required: true
    default: ''
  java-version:
    description: 'Java version'
    required: true
    default: '21'
  settings-path:
    description: 'Maven related setting to point to the directory where the settings.xml file will be written. Default is ~/.m2.'
    required: false
    default: '~/.m2'
  maven-version:
    description: 'Maven version to install when the runner has no mvn on its PATH (preinstalled Maven is used as-is)'
    required: false
    default: '3.9.16'
  cache-maven:
    description: 'Enable Maven dependency caching'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: ${{ inputs.distribution }}
        architecture: ${{ inputs.architecture }}
        java-version: ${{ inputs.java-version }}
        settings-path: ${{ inputs.settings-path }}
        overwrite-settings: false

    # GitHub-hosted runners and macduff ship Maven; bare self-hosted VMs do not.
    - name: Install Maven (if missing)
      shell: bash
      env:
        MAVEN_VERSION: ${{ inputs.maven-version }}
      run: |
        if command -v mvn >/dev/null 2>&1; then
          echo "Using preinstalled Maven: $(command -v mvn)"
          exit 0
        fi
        dir="${RUNNER_TOOL_CACHE}/maven/${MAVEN_VERSION}"
        if [ ! -x "${dir}/bin/mvn" ]; then
          base="https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}"
          archive="${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          curl -fsSL -o "${archive}" "${base}/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          echo "$(curl -fsSL "${base}/apache-maven-${MAVEN_VERSION}-bin.tar.gz.sha512")  ${archive}" | sha512sum -c -
          mkdir -p "${dir}"
          tar -xzf "${archive}" -C "${dir}" --strip-components=1
          rm -f "${archive}"
        fi
        echo "${dir}/bin" >> "$GITHUB_PATH"
        echo "Installed Maven ${MAVEN_VERSION} to ${dir}"

    - name: Cache Maven dependencies
      if: ${{ inputs.cache-maven == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
