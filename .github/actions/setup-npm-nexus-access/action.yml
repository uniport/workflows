name: 'Setup NPM Nexus Access'
description: 'Sets an access token for a NPM repository on Nexus'

# Thin wrapper around base/setup-npm-nexus-access, kept so callers pinned to this path keep working.
# The implementation lives in base/setup-npm-nexus-access; change it there.

inputs:
  token:
    description: 'The NPM token to setup'
  repository:
    description: 'The Nexus repository to use'
  nexus-url:
    description: 'The Nexus base URL'
    required: true
    default: 'nexus3.inventage.com'
  auth-file:
    description: 'The target .npmrc file where authentication will be saved. Defaults to ~/.npmrc'
    required: true
    default: '${{ github.workspace }}/.npmrc'

runs:
  using: 'composite'
  steps:
    - uses: uniport/workflows/.github/actions/base/setup-npm-nexus-access@main
      with:
        token: ${{ inputs.token }}
        repository: ${{ inputs.repository }}
        nexus-url: ${{ inputs.nexus-url }}
        auth-file: ${{ inputs.auth-file }}
