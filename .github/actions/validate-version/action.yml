name: Validate Version
description: Validates a version string against the format semver-date-build_number-git_short_sha

# Thin wrapper around base/validate-version, kept so callers pinned to this path keep working.
# The implementation lives in base/validate-version; change it there.

inputs:
  version:
    description: 'Version string to validate (e.g., 9.5.0-202504221620-1321-d65d211b)'
    required: true

runs:
  using: composite
  steps:
    - uses: uniport/workflows/.github/actions/base/validate-version@main
      with:
        version: ${{ inputs.version }}
