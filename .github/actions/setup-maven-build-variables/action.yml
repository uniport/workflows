name: Setup Variables
description: Sets up version-related variables from pom.xml and Git metadata

# Thin wrapper around base/setup-maven-build-variables, kept so callers pinned to this path keep working.
# The implementation lives in base/setup-maven-build-variables; change it there.

outputs:
  REACTOR_VERSION:
    description: The full version from pom.xml (e.g., 1.0.0-SNAPSHOT)
    value: ${{ steps.base.outputs.REACTOR_VERSION }}
  SEMVER:
    description: The version without -SNAPSHOT (e.g., 1.0.0)
    value: ${{ steps.base.outputs.SEMVER }}
  VERSION_SUFFIX:
    description: A suffix combining build date, run number, and short SHA (e.g., 20250422123045-123-abcdefg)
    value: ${{ steps.base.outputs.VERSION_SUFFIX }}
  RC_VERSION:
    description: The release candidate version (e.g., 1.0.0-20250422123045-123-abcdefg)
    value: ${{ steps.base.outputs.RC_VERSION }}
  SHORT_SHA:
    description: The short Git SHA (first 7 characters)
    value: ${{ steps.base.outputs.SHORT_SHA }}
  FULL_SHA:
    description: The full Git SHA
    value: ${{ steps.base.outputs.FULL_SHA }}
  GROUP_ID:
    description: The groupId from pom.xml
    value: ${{ steps.base.outputs.GROUP_ID }}

runs:
  using: composite
  steps:
    - id: base
      uses: uniport/workflows/.github/actions/base/setup-maven-build-variables@main
