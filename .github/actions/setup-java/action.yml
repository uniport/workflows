name: 'Setup Java'
description: 'Sets up Java'

# Thin wrapper around base/setup-java, kept so callers pinned to this path keep working.
# The implementation lives in base/setup-java; change it there.

inputs:
  distribution:
    description: 'Java distribution'
    required: true
    default: 'temurin'
  architecture:
    description: 'The target architecture of the package. Possible values: `x86`, `x64`, `armv7`, `aarch64`, `ppc64le`. Default value: Derived from the runner machine.'
    required: true
    default: ''
  java-version:
    description: 'Java version'
    required: true
    default: '21'
  settings-path:
    description: 'Maven related setting to point to the directory where the settings.xml file will be written. Default is ~/.m2.'
    required: false
    default: '~/.m2'
  cache-maven:
    description: 'Enable Maven dependency caching'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - uses: uniport/workflows/.github/actions/base/setup-java@main
      with:
        distribution: ${{ inputs.distribution }}
        architecture: ${{ inputs.architecture }}
        java-version: ${{ inputs.java-version }}
        settings-path: ${{ inputs.settings-path }}
        cache-maven: ${{ inputs.cache-maven }}
